<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala de GO — Turma MED/UNIFACS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFF1F3;
    --surface: #FFFFFF;
    --surface-2: #F6F7F9;
    --ink: #1B2027;
    --ink-soft: #5B6472;
    --ink-faint: #8992A0;
    --line: #E1E4E9;
    --accent: #2F6F6B;
    --accent-bg: #E7F1EF;
    --warn-bg: #FBF1E0;
    --warn-ink: #8A5A11;

    --hp: #2F6F6B; --hp-bg: #E7F1EF;
    --sa: #6E7F3D; --sa-bg: #EEF1E3;
    --hap: #B5651D; --hap-bg: #F6EAE0;
    --ham: #7B4B94; --ham-bg: #F0E7F4;
    --hm: #3D5A80; --hm-bg: #E6ECF3;
    --didatica: #8992A0; --didatica-bg: #EEF0F2;

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181D; --surface: #1D2129; --surface-2: #232833;
      --ink: #ECEEF1; --ink-soft: #A7AFBB; --ink-faint: #747E8C; --line: #2C313B;
      --accent-bg: #1D3230; --warn-bg: #2E2611; --warn-ink: #E3BE7A;
      --hp-bg: #1D3230; --sa-bg: #262B1C; --hap-bg: #322418; --ham-bg: #2A2033; --hm-bg: #1D2530; --didatica-bg: #232833;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181D; --surface: #1D2129; --surface-2: #232833;
    --ink: #ECEEF1; --ink-soft: #A7AFBB; --ink-faint: #747E8C; --line: #2C313B;
    --accent-bg: #1D3230; --warn-bg: #2E2611; --warn-ink: #E3BE7A;
    --hp-bg: #1D3230; --sa-bg: #262B1C; --hap-bg: #322418; --ham-bg: #2A2033; --hm-bg: #1D2530; --didatica-bg: #232833;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header.top { padding: 22px 20px 4px; max-width: 1400px; margin: 0 auto; }
  h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 23px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .subtitle { color: var(--ink-soft); font-size: 13px; margin: 0 0 10px; line-height: 1.5; }
  .notice {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--warn-bg); color: var(--warn-ink);
    font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 100px;
  }

  /* Week nav */
  .weeknav {
    max-width: 1400px; margin: 16px auto 0; padding: 0 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .weeknav .navbtn {
    width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: none; transition: opacity .15s ease, background .15s ease;
  }
  .weeknav .navbtn:hover:not(:disabled) { background: var(--surface-2); }
  .weeknav .navbtn:disabled { opacity: .35; cursor: default; }
  .weeknav .weekinfo { display: flex; flex-direction: column; gap: 1px; }
  .weeknav .weeklabel { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15.5px; }
  .weeknav .monthrange { font-size: 12px; color: var(--ink-soft); }
  .weekdots { display: flex; gap: 5px; margin-left: 4px; }
  .weekdots button {
    width: 7px; height: 7px; border-radius: 50%; border: none; padding: 0;
    background: var(--line); cursor: pointer;
  }
  .weekdots button.active { background: var(--accent); width: 16px; border-radius: 5px; }

  /* Controls */
  .controls { max-width: 1400px; margin: 14px auto 0; padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-row .row-label { font-size: 11px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  .chip {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; font-weight: 500;
    padding: 6px 12px; border-radius: 100px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; background: var(--surface-2); }
  .chip.all[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .chip.intern[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
  .chip.clear { color: var(--ink-faint); border-style: dashed; }

  .search {
    display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line);
    border-radius: 100px; padding: 6px 12px; background: var(--surface); max-width: 260px;
  }
  .search input { border: none; outline: none; background: transparent; font-family: 'IBM Plex Sans', sans-serif; font-size: 12.5px; color: var(--ink); width: 100%; }
  .search input::placeholder { color: var(--ink-faint); }
  .search svg { flex: none; color: var(--ink-faint); }

  /* Board */
  .board {
    max-width: 1400px; margin: 18px auto 8px; padding: 0 20px;
    display: grid; grid-template-columns: repeat(7, minmax(230px, 1fr)); gap: 12px;
    overflow-x: auto; scroll-snap-type: x proximity;
  }
  @media (max-width: 900px) {
    .board { grid-auto-flow: column; grid-template-columns: none; }
    .board .day { width: 78vw; scroll-snap-align: start; }
  }
  .day { background: var(--surface-2); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 8px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .day-head .name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; }
  .day-head .date { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; }

  .card { background: var(--surface); border-radius: 12px; padding: 10px 11px; border-left: 3px solid var(--accent); box-shadow: 0 1px 2px rgba(20,24,30,.05); }
  .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .card .time { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; }
  .card .turno { font-size: 10.5px; color: var(--ink-faint); }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 100px; margin-bottom: 7px; }

  .intern-line {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700; color: var(--ink);
    background: var(--accent-bg); border-radius: 8px; padding: 5px 8px; margin-bottom: 7px;
  }
  .intern-line.placeholder { font-weight: 500; font-size: 11.5px; color: var(--ink-faint); background: var(--surface-2); font-style: italic; }
  .intern-line svg { flex: none; }
  .intern-stack { display:flex; flex-direction:column; gap:5px; margin-bottom:7px; }
  .intern-stack .intern-line { margin-bottom:0; }
  .intern-line.liberacao { background:#7A2E2E; color:#FFFFFF; border:1px solid #682525; font-size:11.5px; font-weight:700; }
  .card.liberated { opacity:.62; }
  .card.liberated:hover { opacity:.82; }

  .card .doctor { font-size: 12px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; margin-bottom: 2px; }
  .card .hospital { font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; }
  .card .meta { font-size: 11px; color: var(--ink-faint); }
  .freq.quinzenal { color: var(--accent); font-weight: 500; }

  .card.didatica { border-left-color: var(--didatica); background: var(--didatica-bg); }
  .card.didatica .doctor { font-size: 12.5px; color: var(--ink); font-weight: 600; }

  .empty { color: var(--ink-faint); font-size: 11.5px; padding: 10px 4px; text-align: center; }
  .hidden { display: none !important; }

  /* Arrival instructions */
  .instructions {
    max-width: 1400px; margin: 8px auto 40px; padding: 0 20px;
  }
  .instructions h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; margin: 18px 0 10px; }
  .acc-item { background: var(--surface); border-radius: 12px; margin-bottom: 8px; overflow: hidden; border-left: 3px solid var(--line); }
  .acc-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .acc-head .hname { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .acc-head .hname .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .acc-head .chev { color: var(--ink-faint); transition: transform .15s ease; flex: none; }
  .acc-item.open .chev { transform: rotate(180deg); }
  .acc-body { max-height: 0; overflow: hidden; transition: max-height .2s ease; }
  .acc-item.open .acc-body { max-height: 1000px; }
  .acc-body-inner {
      white-space: pre-line; padding: 0 14px 14px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .acc-body-inner.pending { color: var(--ink-faint); font-style: italic; }

  /* Intern stats */
  .stat-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 13px; min-width: 190px;
  }
  .stat-card .stat-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12.5px; margin-bottom: 6px; }
  .stat-card .stat-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--ink-soft); padding: 1px 0; }
  .stat-card .stat-row strong { color: var(--ink); font-weight: 700; }
</style>
</head>

<div id="board" class="board"></div>

<script>
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAY_LABELS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

const ROTATION_START = new Date(2026, 8, 21); // Segunda 21/09/2026
const TOTAL_WEEKS = 6;

function weekDates(weekNum) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(ROTATION_START);
    d.setDate(d.getDate() + (weekNum - 1) * 7 + i);
    dates.push(d);
  }
  return dates;
}
function fmt(d) { return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(dates) {
  const months = [...new Set(dates.map(d => d.getMonth()))];
  return months.map(m => MONTHS[m]).join(' / ');
}

const HOSPITALS = {

  sa:  { label: 'Santo Amaro', color: 'var(--sa)', bg: 'var(--sa-bg)' },

// Arrival instructions per hospital — fill in as info arrives
const ARRIVAL_INFO = {
  hp: '<strong>Acesso ao Hospital Português:</strong> Contate o professor na véspera do dia de centro cirúrgico para receber as instruções de acesso ao Hospital Português. Nas atividades no Hospital Português, apenas 1 interno por vez. O acesso ao Centro Médico (ambulatório, sala 307) é livre ao público.',

  ham: `Mastologia: a palestra introdutória é obrigatória para acesso ao estágio de Mastologia no Hospital Aristides Maltez. As atividades só devem ser iniciadas após a palestra. O acesso ao hospital é permitido somente com crachá e jaleco. Após a palestra, procurar a Sra. Valdeci, no DEP (tel. 3357-6812), para retirar o crachá. Sem identificação, não é permitido o acesso ao hospital. As atividades são acompanhadas pelo(s) médico(s) residente(s) do turno.

<strong>Ambulatório:</strong> dirigir-se ao Ambulatório de Mastologia e apresentar-se ao residente/preceptor, acompanhando as atividades e os atendimentos, conforme a programação.

<strong>Centro cirúrgico:</strong> ao chegar, trocar de roupa no vestiário e consultar o mapa ou perguntar à enfermagem pela sala da Mastologia, geralmente a sala 09. Evitar atrasos e levar apenas o necessário, pois não há armários para bolsas ou mochilas. Não usar adornos no centro cirúrgico; apenas brincos pequenos são permitidos. Não usar colares/correntes, anéis ou pulseiras. Usar sapato fechado, impermeável e sem furos, preferencialmente NR32. Utilizar propé quando necessário. Levar óculos de proteção; há óculos disponíveis no centro cirúrgico caso necessário. Se entrar no campo cirúrgico, solicitar orientação ao técnico da sala ou auxiliar de enfermagem.

<strong>Durante as atividades:</strong> celular somente nos intervalos das cirurgias. Não realizar ligações dentro das salas cirúrgicas; se necessário, pedir autorização e dirigir-se às áreas permitidas, como copa ou conforto médico. Jaleco e crachá são obrigatórios e o crachá deve permanecer visível. Levar caneta para anotações e solicitações de exames.

<strong>Sessão clínica:</strong> podem ocorrer sessões clínicas da Residência Médica on-line, via Google Meet, às terças ou quartas-feiras, às 19h30. O link é enviado no grupo. Quem estiver de plantão ou em outras atividades da faculdade está dispensado.`,

  hm: `Visita técnica: o rodízio no Hospital da Mulher funciona como visita técnica, pois os internos são oficiais de outro campo de estágio. O acesso às instalações será sempre acompanhado pela Dra. Narjara ou por seus residentes.

<strong>Ponto de encontro:</strong> banquinhos de madeira, na entrada do estacionamento, em frente ao Tratamento com Amor.

<strong>IMPORTANTE:</strong> não tentar entrar pela entrada da Administração nem procurar os agentes de portaria ou seguranças para acesso.`,

  sa: null,
};

let currentWeek = 1;
const activeHospitalFilters = new Set(['hp','sa','hap','ham','hm','didatica']);
const activeInternFilters = new Set();
let searchTerm = '';

const board = document.getElementById('board');

function cardHTML(ev, week) {
  if (ev.tipo === 'didatica') {
    return `
      <div class="card didatica" data-filter="didatica" data-interns="" data-doctor="${ev.doctor.toLowerCase()}">
        <div class="row1"><span class="time">${ev.horario}</span><span class="turno">Didática</span></div>
        <div class="doctor">${ev.doctor}</div>
        <div class="hospital">${ev.atividade}</div>
        <div class="meta"><span class="freq ${/quinzen|oposta|m\u00eas/i.test(ev.freq) ? 'quinzenal' : ''}">${ev.freq}</span></div>
      </div>`;
  }
  const h = HOSPITALS[ev.hospitalKey];
  const isQuinzenal = /quinzen/i.test(ev.freq);
  const names = (ev.internsByWeek && ev.internsByWeek[week]) || null;
  const internHTML = names
    ? `<div class="intern-stack">${names.map(name => `<div class="intern-line"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>${name}</div>`).join('')}</div>`
    : `<div class="intern-line placeholder">${ev.internosCount} interno${ev.internosCount>1?'s':''} — a definir</div>`;
  const liberation = ev.liberation && ev.liberation[week]
    ? `<div class="intern-line liberacao"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v18M3 12h18"/></svg>${ev.liberation[week]}</div>`
    : '';
  const internsData = names ? names.join('|').toLowerCase() : '';
  return `
    <div class="card${liberation ? ' liberated' : ''}" data-filter="${ev.hospitalKey}" data-interns="${internsData}" data-doctor="${ev.doctor.toLowerCase()}" style="border-left-color:${h.color}">
      <div class="row1"><span class="time">${ev.horario}</span><span class="turno">${ev.turno}</span></div>
      <span class="badge" style="background:${h.bg};color:${h.color}">${ev.atividade}</span>
      ${internHTML}
      ${liberation}
      <div class="doctor">${ev.doctor}</div>
      <div class="hospital">${h.label}${ev.local ? ' · ' + ev.local : ''}</div>
      <div class="meta"><span class="freq ${isQuinzenal ? 'quinzenal' : ''}">${ev.freq}</span></div>
    </div>`;
}

function renderBoard() {
  const dates = weekDates(currentWeek);
  board.innerHTML = DAY_KEYS.map((key, i) => {
    const dayEvents = EVENTS.filter(ev => ev.day === key && ev.weeks.includes(currentWeek));
    const visible = dayEvents.filter(ev => {
      const filterKey = ev.tipo === 'didatica' ? 'didatica' : ev.hospitalKey;
      const matchesHospital = activeHospitalFilters.has(filterKey);
      const names = (ev.internsByWeek && ev.internsByWeek[currentWeek]) || [];
      const matchesIntern = activeInternFilters.size === 0 || names.some(n => activeInternFilters.has(n));
      const hay = (ev.doctor + ' ' + names.join(' ')).toLowerCase();
      const matchesSearch = !searchTerm || hay.includes(searchTerm);
      return matchesHospital && matchesIntern && matchesSearch;
    });
    const cardsHTML = visible.length
      ? visible.map(ev => cardHTML(ev, currentWeek)).join('')
      : `<div class="empty">${dayEvents.length ? 'Nada com esse filtro' : 'Sem atividades'}</div>`;
    return `
      <div class="day">
        <div class="day-head"><span class="name">${DAY_LABELS[i]}</span><span class="date">${fmt(dates[i])}</span></div>
        ${cardsHTML}
      </div>`;
  }).join('');
}

function renderWeekNav() {
  const dates = weekDates(currentWeek);
  document.getElementById('weekLabel').textContent = `Semana ${currentWeek} de ${TOTAL_WEEKS}`;
  document.getElementById('monthRange').textContent = `${monthLabel(dates)} · ${fmt(dates[0])} – ${fmt(dates[6])}`;
  document.getElementById('prevWeek').disabled = currentWeek === 1;
  document.getElementById('nextWeek').disabled = currentWeek === TOTAL_WEEKS;
  document.getElementById('weekDots').innerHTML = ALL_WEEKS.map(w =>
    `<button class="${w===currentWeek?'active':''}" data-week="${w}" aria-label="Semana ${w}"></button>`
  ).join('');
}

function computeInternStats(name) {
  let total = 0, cc = 0, amb = 0, saDiurno = 0, saNoturno = 0;
  EVENTS.forEach(ev => {
    if (ev.tipo === 'didatica' || !ev.internsByWeek) return;
    Object.values(ev.internsByWeek).forEach(names => {
      if (!names.includes(name)) return;
      total++;
      if (/centro cir/i.test(ev.atividade)) cc++;
      else if (/ambulat/i.test(ev.atividade)) amb++;
      if (ev.hospitalKey === 'sa') {
        if (/diurno/i.test(ev.turno)) saDiurno++;
        else if (/noturno/i.test(ev.turno)) saNoturno++;
      }
    });
  });
  return { total, cc, amb, saDiurno, saNoturno };
}

function renderInternStats() {
  const panel = document.getElementById('internStats');
  if (activeInternFilters.size === 0) { panel.innerHTML = ''; return; }
  panel.innerHTML = [...activeInternFilters].sort().map(name => {
    const s = computeInternStats(name);
    return `
      <div class="stat-card">
        <div class="stat-name">${name}</div>
        <div class="stat-row"><span>Total de plantões</span><strong>${s.total}</strong></div>
        <div class="stat-row"><span>Centro Cirúrgico</span><strong>${s.cc}</strong></div>
        <div class="stat-row"><span>Ambulatório</span><strong>${s.amb}</strong></div>
        <div class="stat-row"><span>Santo Amaro · Diurno</span><strong>${s.saDiurno}</strong></div>
        <div class="stat-row"><span>Santo Amaro · Noturno</span><strong>${s.saNoturno}</strong></div>
      </div>`;
  }).join('');
}

function renderInternChips() {
  const row = document.getElementById('internControls');
  const chips = INTERNS.map(name =>
    `<button class="chip intern" data-intern="${name}" aria-pressed="false">${name}</button>`
  ).join('');
  row.innerHTML = `<span class="row-label">Internos</span>${chips}<button class="chip clear" id="clearInterns">Limpar seleção</button>`;
}

function renderAll() {
  renderWeekNav();
  renderBoard();
}

// Week navigation
document.getElementById('prevWeek').addEventListener('click', () => { if (currentWeek > 1) { currentWeek--; renderAll(); } });
document.getElementById('nextWeek').addEventListener('click', () => { if (currentWeek < TOTAL_WEEKS) { currentWeek++; renderAll(); } });
document.getElementById('weekDots').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-week]');
  if (!btn) return;
  currentWeek = Number(btn.dataset.week);
  renderAll();
});

// Hospital filters
document.getElementById('hospitalControls').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-filter]');
  if (!chip) return;
  const f = chip.dataset.filter;
  const allKeys = ['hp','sa','hap','ham','hm','didatica'];
  if (f === 'all') {
    const allActive = activeHospitalFilters.size === allKeys.length;
    activeHospitalFilters.clear();
    if (!allActive) allKeys.forEach(k => activeHospitalFilters.add(k));
  } else {
    if (activeHospitalFilters.has(f)) activeHospitalFilters.delete(f); else activeHospitalFilters.add(f);
  }
  document.querySelectorAll('#hospitalControls .chip[data-filter]').forEach(c => {
    if (c.dataset.filter === 'all') c.setAttribute('aria-pressed', String(activeHospitalFilters.size === allKeys.length));
    else c.setAttribute('aria-pressed', String(activeHospitalFilters.has(c.dataset.filter)));
  });
  renderBoard();
});

// Intern filters (event delegation, chips re-rendered once)
document.getElementById('internControls').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip.intern');
  if (chip) {
    const name = chip.dataset.intern;
    if (activeInternFilters.has(name)) activeInternFilters.delete(name); else activeInternFilters.add(name);
    chip.setAttribute('aria-pressed', String(activeInternFilters.has(name)));
    renderBoard();
    renderInternStats();
    return;
  }
  if (e.target.closest('#clearInterns')) {
    activeInternFilters.clear();
    document.querySelectorAll('#internControls .chip.intern').forEach(c => c.setAttribute('aria-pressed','false'));
    renderBoard();
    renderInternStats();
  }
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderBoard();
});

// Arrival instructions accordion
const accordion = document.getElementById('accordion');
accordion.innerHTML = Object.entries(HOSPITALS).map(([key, h]) => {
  const info = ARRIVAL_INFO[key];
  return `
    <div class="acc-item" style="border-left-color:${h.color}">
      <div class="acc-head" data-acc="${key}">
        <span class="hname"><span class="dot" style="background:${h.color}"></span>${h.label}</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="acc-body">
        <div class="acc-body-inner ${info ? '' : 'pending'}">${info || 'Instruções ainda não informadas.'}</div>
      </div>
    </div>`;
}).join('');
accordion.addEventListener('click', (e) => {
  const head = e.target.closest('.acc-head');
  if (!head) return;
  head.closest('.acc-item').classList.toggle('open');
});

renderInternChips();
renderInternStats();
renderAll();
</script>
</body>
</html>
